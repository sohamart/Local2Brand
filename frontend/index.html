  <!-- Instant Zero-FOUC Theme Initializer (Prevents Light Mode Blink on Refresh) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('l2b_theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
          root.style.backgroundColor = '#07090e';
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
          root.style.backgroundColor = '#ffffff';
        }
      } catch (e) {}
    })();
  </script>

  <!-- PWA Service Worker & Global Install Prompt Capturer -->
  <script>
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      try {
        localStorage.removeItem('l2b_app_installed');
        sessionStorage.removeItem('l2b_is_app');
      } catch (err) {}
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      console.log('L2B PWA: beforeinstallprompt captured successfully!');
    });

    // Chunk Failure Auto-Recovery on New Vercel Deploys
    window.addEventListener('vite:preloadError', function () {
      console.warn('L2B Vite: Chunk load error detected, reloading fresh build...');
      window.location.reload();
    });

    window.addEventListener('error', function (e) {
      if (
        e &&
        e.message &&
        (e.message.includes('Failed to fetch dynamically imported module') ||
          e.message.includes('Expected a JavaScript-or-Wasm module script'))
      ) {
        var hasReloaded = sessionStorage.getItem('l2b_chunk_reload');
        if (!hasReloaded) {
          sessionStorage.setItem('l2b_chunk_reload', 'true');
          window.location.reload();
        }
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(
          function (registration) {
            registration.update();
            console.log('L2B PWA ServiceWorker registered with scope: ', registration.scope);
          },
          function (err) {
            console.log('L2B PWA ServiceWorker registration failed: ', err);
          }
        );
      });
    }
  </script>
